<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f"><title>DSA Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#08111f;color:#f4f7fb;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px}.brand{font-size:22px;font-weight:900}.brand b{color:#ffd34d}
.coins{background:#182942;border:1px solid #304866;border-radius:30px;padding:9px 13px;font-weight:800}
.hero,.card,.topic,.company,.lesson,.qbox{background:#0f1d31;border:1px solid #263b55;border-radius:17px;padding:16px}
.hero{margin-bottom:12px;background:#10243b}.hero h1{font-size:26px;margin-bottom:7px}.hero p,.small,.muted{color:#9eb0c8;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.list{display:grid;gap:10px}.section{margin:18px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:8px;background:#20324a;border-radius:9px;overflow:hidden;margin:9px 0}.bar{height:100%;background:#ffd34d}
.btn{border:0;border-radius:11px;padding:11px 14px;background:#ffd34d;color:#111;font-weight:800}.btn.secondary{background:#203650;color:#fff}.btn.green{background:#35d07f}.btn:disabled{opacity:.45}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.badge{display:inline-block;background:#203650;border-radius:20px;padding:5px 8px;font-size:12px;margin:2px}
.lock{color:#ffd34d}.back{margin-bottom:12px}.lesson{line-height:1.65}.lesson h2{margin:9px 0}.lesson h3{color:#ffd34d;margin:17px 0 6px}.code{background:#06101b;border:1px solid #273c57;border-radius:11px;padding:12px;font:13px monospace;white-space:pre-wrap}
.option{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:10px;border:1px solid #2a4361;background:#172943;color:#fff}.option.correct{background:#123a2a;border-color:#35d07f}.option.wrong{background:#421f28;border-color:#ff6677}
.answer{margin-top:12px;padding:11px;background:#142b42;border-radius:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1728;border-top:1px solid #253a55;z-index:10}.navin{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;color:#9eb0c8;padding:10px 3px;font-size:12px}.nav button.active{color:#ffd34d;font-weight:900}
input{width:100%;background:#081421;color:#fff;border:1px solid #2a4361;border-radius:10px;padding:11px;margin-top:7px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;background:#182b44;border:1px solid #36506e;padding:11px 14px;border-radius:11px;z-index:50;transition:.2s;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
.adnote{border:1px dashed #36506e;border-radius:10px;padding:9px;text-align:center;color:#71849d;font-size:11px;margin-top:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:23px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script>
(function(){
"use strict";
var TOPICS=[{"id":"t1","name":"Big O & Complexity","cost":0},{"id":"t2","name":"Arrays","cost":50},{"id":"t3","name":"Strings","cost":50},{"id":"t4","name":"Searching","cost":75},{"id":"t5","name":"Sorting","cost":75},{"id":"t6","name":"Linked Lists","cost":100},{"id":"t7","name":"Stacks","cost":100},{"id":"t8","name":"Queues","cost":100},{"id":"t9","name":"Hashing","cost":125},{"id":"t10","name":"Recursion","cost":125},{"id":"t11","name":"Two Pointers","cost":150},{"id":"t12","name":"Sliding Window","cost":150},{"id":"t13","name":"Trees","cost":150},{"id":"t14","name":"Binary Search Tree","cost":175},{"id":"t15","name":"Heaps & Priority Queue","cost":175},{"id":"t16","name":"Graphs","cost":200},{"id":"t17","name":"Greedy Algorithms","cost":200},{"id":"t18","name":"Dynamic Programming","cost":200},{"id":"t19","name":"Backtracking","cost":200},{"id":"t20","name":"Advanced DSA","cost":250}], COMPANIES=[{"name":"Local Companies","cost":1000},{"name":"Infosys","cost":2000},{"name":"TCS","cost":3000},{"name":"Deloitte","cost":5000},{"name":"JPMorgan","cost":7500},{"name":"Top Companies","cost":10000}], BANK=[{"cat":"Big O","q":"Array index access is usually?","a":"O(1)","w":["O(log n)","O(n)"]},{"cat":"Big O","q":"A single loop over n items is usually?","a":"O(n)","w":["O(1)","O(n²)"]},{"cat":"Big O","q":"Two nested loops of n each are usually?","a":"O(n²)","w":["O(n)","O(log n)"]},{"cat":"Arrays","q":"Which structure gives direct indexed access?","a":"Array","w":["Stack","Graph"]},{"cat":"Arrays","q":"Inserting at the front of a normal array can cost?","a":"O(n)","w":["O(1) always","O(log n)"]},{"cat":"Arrays","q":"For a sorted array, target pair sum can often use?","a":"Two pointers","w":["DFS","Heapify"]},{"cat":"Strings","q":"A palindrome reads the same in which direction?","a":"Both directions","w":["Only left-to-right","Only right-to-left"]},{"cat":"Strings","q":"Character frequency is commonly stored in a?","a":"Hash map","w":["Queue","Heap"]},{"cat":"Strings","q":"A substring is?","a":"A contiguous part of a string","w":["Any permutation","A graph path"]},{"cat":"Searching","q":"Binary search requires the search space to be?","a":"Sorted/monotonic","w":["Random","A linked list"]},{"cat":"Searching","q":"Binary search worst-case time is?","a":"O(log n)","w":["O(n)","O(n²)"]},{"cat":"Searching","q":"Linear search worst-case time is?","a":"O(n)","w":["O(1)","O(log n)"]},{"cat":"Sorting","q":"Bubble sort worst-case time is?","a":"O(n²)","w":["O(log n)","O(n log n)"]},{"cat":"Sorting","q":"Merge sort time is typically?","a":"O(n log n)","w":["O(n²)","O(1)"]},{"cat":"Sorting","q":"Quicksort average time is typically?","a":"O(n log n)","w":["O(n)","O(log n)"]},{"cat":"Linked Lists","q":"A node normally stores data plus a?","a":"Reference/link","w":["Hash function","Priority"]},{"cat":"Linked Lists","q":"Insert at the head of a singly linked list is usually?","a":"O(1)","w":["O(n)","O(n²)"]},{"cat":"Linked Lists","q":"Cycle detection commonly uses?","a":"Slow and fast pointers","w":["Binary search","Merge sort"]},{"cat":"Stacks","q":"A stack follows?","a":"LIFO","w":["FIFO","Priority order"]},{"cat":"Stacks","q":"Adding to a stack is called?","a":"Push","w":["Pop","Dequeue"]},{"cat":"Stacks","q":"Removing the top item is called?","a":"Pop","w":["Push","Enqueue"]},{"cat":"Queues","q":"A queue follows?","a":"FIFO","w":["LIFO","Random order"]},{"cat":"Queues","q":"Adding to a queue is called?","a":"Enqueue","w":["Pop","Push"]},{"cat":"Queues","q":"Removing from the front is called?","a":"Dequeue","w":["Push","Peek"]},{"cat":"Hashing","q":"Average hash-table lookup is often?","a":"O(1)","w":["O(log n)","O(n²)"]},{"cat":"Hashing","q":"A collision means?","a":"Two keys map to the same bucket","w":["A tree is balanced","A stack is empty"]},{"cat":"Hashing","q":"A common collision method is?","a":"Chaining","w":["Binary search","DFS"]},{"cat":"Recursion","q":"A recursive function needs a?","a":"Base case","w":["Heap","Queue"]},{"cat":"Recursion","q":"Nested recursive calls are tracked by the?","a":"Call stack","w":["Hash table","Adjacency matrix"]},{"cat":"Recursion","q":"Factorial of 5 equals?","a":"120","w":["25","60"]},{"cat":"Two Pointers","q":"Two pointers means maintaining?","a":"Two indices/references","w":["Two arrays always","Two heaps"]},{"cat":"Two Pointers","q":"On a sorted pair-sum problem, if the sum is too small you often?","a":"Move the left pointer right","w":["Move both left","Restart"]},{"cat":"Two Pointers","q":"Two pointers can often reduce a sorted pair problem from?","a":"O(n²) to O(n)","w":["O(n) to O(n²)","O(log n) to O(n²)"]},{"cat":"Sliding Window","q":"A sliding window represents?","a":"A moving contiguous range","w":["A tree branch","A graph edge"]},{"cat":"Sliding Window","q":"Sliding window is especially useful for?","a":"Subarray/substring ranges","w":["Tree rotations","Heap construction"]},{"cat":"Sliding Window","q":"When a window violates a constraint, a common action is to?","a":"Move the left boundary","w":["Sort the whole input","Run DFS"]},{"cat":"Trees","q":"A node with no children is a?","a":"Leaf","w":["Root","Edge"]},{"cat":"Trees","q":"Traversal that visits root before children is?","a":"Preorder","w":["Inorder","Postorder"]},{"cat":"Trees","q":"Traversal left-root-right is?","a":"Inorder","w":["Preorder","BFS"]},{"cat":"Binary Search Tree","q":"In a typical BST, values in the left subtree are?","a":"Smaller than the node","w":["Always larger","Always equal"]},{"cat":"Binary Search Tree","q":"Balanced BST search is typically?","a":"O(log n)","w":["O(n²)","O(1)"]},{"cat":"Binary Search Tree","q":"A completely skewed BST can have search time?","a":"O(n)","w":["O(log n) always","O(1)"]},{"cat":"Heaps & Priority Queue","q":"The root of a min-heap is the?","a":"Minimum element","w":["Maximum element","Median"]},{"cat":"Heaps & Priority Queue","q":"Heap insertion is usually?","a":"O(log n)","w":["O(n²)","O(1) always"]},{"cat":"Heaps & Priority Queue","q":"A priority queue is commonly implemented with a?","a":"Heap","w":["String","Graph"]},{"cat":"Graphs","q":"A graph vertex is a?","a":"Node","w":["Sorting pass","Hash bucket"]},{"cat":"Graphs","q":"A graph edge represents a?","a":"Connection","w":["Stack frame","Tree height"]},{"cat":"Graphs","q":"A sparse graph is commonly stored using an?","a":"Adjacency list","w":["Only an array of values","Only a stack"]},{"cat":"Greedy Algorithms","q":"A greedy algorithm chooses?","a":"A locally best option","w":["Every possibility","A random option"]},{"cat":"Greedy Algorithms","q":"Greedy correctness requires?","a":"A problem-specific proof/greedy property","w":["No proof ever","Sorting twice"]},{"cat":"Greedy Algorithms","q":"Which is a classic greedy-style problem?","a":"Activity selection","w":["Binary search","String reversal"]},{"cat":"Dynamic Programming","q":"DP commonly uses?","a":"Overlapping subproblems and optimal substructure","w":["Only hashing","Only sorting"]},{"cat":"Dynamic Programming","q":"Memoization stores?","a":"Previously computed results","w":["Only input indexes","Graph edges"]},{"cat":"Dynamic Programming","q":"Bottom-up DP usually starts from?","a":"Base cases","w":["The final answer only","Random states"]},{"cat":"Backtracking","q":"Backtracking generally means?","a":"Choose, recurse, undo","w":["Sort, hash, stop","BFS only"]},{"cat":"Backtracking","q":"N-Queens is commonly solved using?","a":"Backtracking","w":["Binary search","Bubble sort"]},{"cat":"Backtracking","q":"A backtracking solution should stop exploring a branch when?","a":"The partial choice cannot lead to a valid solution","w":["The array is sorted","The queue is empty"]},{"cat":"Advanced DSA","q":"Before choosing an algorithm, inspect the?","a":"Constraints","w":["Variable names only","Screen size"]},{"cat":"Advanced DSA","q":"If n is extremely large, an O(n²) solution is usually?","a":"Risky/too slow","w":["Always ideal","Required"]},{"cat":"Advanced DSA","q":"A strong interview explanation should include?","a":"Approach, correctness and complexity","w":["Only final code","Only output"]}], LESSONS=["Concept & Why It Matters", "Core Operations & Patterns", "Code & Line-by-Line Thinking", "Practice, Complexity & Interview Tips"];
var KEY="dsa_master_final_v6", state=load(), view="home", topicId=null, lessonNo=1, company=null, qi=0, answered=false, selected=null;

function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}return{nickname:"NITIN",coins:1000,streak:1,sound:true,topics:{t1:true},companies:{},lessons:{},companyDone:{},totalCorrect:0,referral:"DSA"+Math.random().toString(36).slice(2,8).toUpperCase()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(s){var x=document.getElementById("toast");x.textContent=s;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(function(){x.classList.remove("show")},2200)}
function spend(n){n=Number(n);if(state.coins<n){toast("Not enough coins");return false}state.coins-=n;save();return true}
function earn(n){state.coins+=Number(n);save()}
function progress(id){var x=state.lessons[id]||{},n=0;for(var k in x)if(x[k])n++;return Math.round(n/4*100)}
function unlocked(id){return !!state.topics[id]}
function head(){return '<div class="top"><div class="brand">DSA <b>MASTER</b></div><div class="coins">🪙 '+state.coins+'</div></div>'}
function nav(){return'<div class="nav"><div class="navin"><button class="'+(view=="home"?"active":"")+'" data-a="home">🏠<br>Home</button><button class="'+(["learn","topic","lesson"].indexOf(view)>=0?"active":"")+'" data-a="learn">📚<br>Learn</button><button class="'+(["companies","company"].indexOf(view)>=0?"active":"")+'" data-a="companies">💼<br>Companies</button><button class="'+(view=="profile"?"active":"")+'" data-a="profile">👤<br>Profile</button></div></div>'}
function render(){var a=document.getElementById("app");if(view=="home")a.innerHTML=home();else if(view=="learn")a.innerHTML=learn();else if(view=="topic")a.innerHTML=topic();else if(view=="lesson")a.innerHTML=lesson();else if(view=="companies")a.innerHTML=companiesPage();else if(view=="company")a.innerHTML=companyPage();else a.innerHTML=profile();a.innerHTML+=nav()}
function home(){var done=0;TOPICS.forEach(function(t){if(unlocked(t.id))done++});return'<div class="wrap">'+head()+
'<div class="hero"><h1>Master DSA. Build your future.</h1><p>Learn concepts, practice patterns and prepare for technical interviews on your phone.</p><div class="actions"><button class="btn" data-a="learn">Start Learning</button><button class="btn secondary" data-a="companies">Interview Practice</button></div></div>'+
'<div class="grid"><div class="card"><h3>🪙 '+state.coins+' Coins</h3><p class="small">Complete lessons and answer practice questions correctly to earn coins.</p><div class="actions"><button class="btn" data-a="reward">Watch Rewarded Ad +50</button></div><p class="small" style="margin-top:7px">The webpage never fakes an ad reward. Native rewarded ads must be handled by the Android ad integration.</p></div><div class="card"><h3>🔥 Streak '+state.streak+'</h3><p class="small">'+done+'/20 topics unlocked</p><div class="progress"><div class="bar" style="width:'+Math.round(done/20*100)+'%"></div></div></div></div>'+
'<h2 class="section">Quick Start</h2><div class="grid"><div class="card"><h3>📚 Learn</h3><p class="small">20 topics × 4 lessons = 80 lessons.</p><button class="btn" style="margin-top:10px" data-a="learn">Open Learn</button></div><div class="card"><h3>💼 Companies</h3><p class="small">6 interview tracks × 60 questions = 360 practice questions.</p><button class="btn" style="margin-top:10px" data-a="companies">Open Companies</button></div></div>'+
'<div class="card" style="margin-top:12px"><h3>Referral</h3><p class="small">Code: <b>'+esc(state.referral)+'</b></p><div class="actions"><button class="btn secondary" data-a="copy" data-t="'+esc(state.referral)+'">Copy</button><button class="btn secondary" data-a="share">Share</button></div></div></div>'}
function learn(){return'<div class="wrap">'+head()+'<button class="btn secondary back" data-a="home">← Back</button><h1>Learn DSA</h1><p class="muted" style="margin:7px 0 14px">20 topics · 4 lessons each</p><div class="list">'+TOPICS.map(function(t){var u=unlocked(t.id),p=progress(t.id);return'<div class="topic"><div class="row"><div><h3>'+esc(t.name)+'</h3><p class="small">'+p+'% complete</p></div><span class="'+(u?"badge":"lock")+'">'+(u?"Unlocked":"🔒 "+t.cost+" 🪙")+'</span></div><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><button class="btn '+(u?"":"secondary")+'" data-a="'+(u?"topic":"unlock")+'" data-id="'+t.id+'">'+(u?"Open Topic":"Unlock for "+t.cost+" 🪙")+'</button></div>'}).join("")+'</div></div>'}
function topic(){var t=TOPICS.find(function(x){return x.id==topicId});if(!t)return learn();return'<div class="wrap">'+head()+'<button class="btn secondary back" data-a="learn">← Topics</button><div class="hero"><h1>'+esc(t.name)+'</h1><p>Four lessons from fundamentals to interview thinking.</p></div><div class="list">'+LESSONS.map(function(n,i){var d=!!((state.lessons[t.id]||{})["l"+(i+1)]);return'<div class="topic"><div class="row"><div><h3>Lesson '+(i+1)+': '+esc(n)+'</h3><p class="small">'+(d?"Completed":"Not completed")+'</p></div><span class="badge">'+(d?"✓ Done":"+10 🪙")+'</span></div><button class="btn" style="margin-top:9px" data-a="lesson" data-id="'+t.id+'" data-n="'+(i+1)+'">'+(d?"Review":"Learn")+'</button></div>'}).join("")+'</div></div>'}
function lesson(){var t=TOPICS.find(function(x){return x.id==topicId}),d=!!((state.lessons[t.id]||{})["l"+lessonNo]);var code="def solve(data):\\n    # choose a data structure/pattern from the constraints\\n    return data";return'<div class="wrap">'+head()+'<button class="btn secondary back" data-a="topic" data-id="'+t.id+'">← '+esc(t.name)+'</button><div class="lesson"><span class="badge">Lesson '+lessonNo+'/4</span><h2>'+esc(LESSONS[lessonNo-1])+'</h2><h3>Concept</h3><p>'+esc(t.name)+' is an important DSA area. Start by understanding the data model, the operations it supports and the constraints that determine the best solution.</p><h3>Why it matters</h3><p>Interview problems test whether you can choose the right structure, explain your reasoning and analyze time and space complexity.</p><h3>Core pattern</h3><p>Break the problem into input, operation, edge cases and output. Then choose the simplest efficient approach.</p><h3>Code example</h3><div class="code">'+esc(code)+'</div><h3>Line-by-line thinking</h3><p>1. Read the input.<br>2. Identify the required operation.<br>3. Choose the appropriate data structure or algorithm.<br>4. Handle edge cases.<br>5. State complexity and test the result.</p><h3>Complexity</h3><p>Always mention time and space complexity. Prefer an efficient solution when constraints are large.</p><h3>Interview tip</h3><p>Do not rush into code. Explain the approach first, then implement it clearly.</p><div class="actions"><button class="btn green" data-a="complete" data-id="'+t.id+'" data-n="'+lessonNo+'" '+(d?"disabled":"")+'>'+(d?"✓ Completed":"+10 Coins — Complete")+'</button><button class="btn secondary" data-a="next" data-id="'+t.id+'" data-n="'+lessonNo+'">Next →</button></div></div></div>'}
function companiesPage(){return'<div class="wrap">'+head()+'<button class="btn secondary back" data-a="home">← Back</button><h1>Company Interview</h1><p class="muted" style="margin:7px 0 14px">Every company track contains 60 curated DSA practice questions. They are not claimed leaked or official past interview questions.</p><div class="list">'+COMPANIES.map(function(c){var u=!!state.companies[c.name],d=(state.companyDone||{})[c.name]||0;return'<div class="company"><div class="row"><div><h3>'+esc(c.name)+'</h3><p class="small">'+d+'/60 answered</p></div><span class="'+(u?"badge":"lock")+'">'+(u?"Unlocked":"🔒 "+c.cost+" 🪙")+'</span></div><div class="progress"><div class="bar" style="width:'+Math.round(d/60*100)+'%"></div></div><button class="btn '+(u?"":"secondary")+'" data-a="'+(u?"company":"unlock-company")+'" data-name="'+esc(c.name)+'" data-cost="'+c.cost+'">'+(u?"Start 60 Questions":"Unlock for "+c.cost+" 🪙")+'</button></div>'}).join("")+'</div></div>'}
function companyPage(){var q=BANK[qi];var opts=[q.a,q.w[0],q.w[1]];return'<div class="wrap">'+head()+'<button class="btn secondary back" data-a="companies">← Companies</button><div class="hero"><h1>'+esc(company)+'</h1><p>Question '+(qi+1)+' of 60 · '+esc(q.cat)+'</p></div><div class="qbox"><h2>'+esc(q.q)+'</h2>'+opts.map(function(o){var cl="";if(answered&&o==q.a)cl=" correct";if(answered&&selected==o&&o!=q.a)cl=" wrong";return'<button class="option'+cl+'" data-a="answer" data-o="'+esc(o)+'" '+(answered?"disabled":"")+'>'+esc(o)+'</button>'}).join("")+(answered?'<div class="answer"><b>Answer:</b> '+esc(q.a)+'<br><span class="small">'+(selected==q.a?"+5 coins — Correct!":"Review this concept and try the next one.")+'</span></div><div class="actions"><button class="btn" data-a="nextq">'+(qi==59?"Finish 60 Questions":"Next Question")+'</button></div>':"")+'</div></div>'}
function profile(){return'<div class="wrap">'+head()+'<h1>Profile</h1><div class="card" style="margin-top:12px"><h3>Nickname</h3><input id="nick" value="'+esc(state.nickname)+'" maxlength="20"><div class="actions"><button class="btn" data-a="save">Save</button></div></div><div class="card" style="margin-top:12px"><h3>Stats</h3><p class="small">Coins: '+state.coins+'</p><p class="small">Correct answers: '+state.totalCorrect+'</p><p class="small">Streak: '+state.streak+'</p><p class="small">Referral: '+esc(state.referral)+'</p></div><div class="card" style="margin-top:12px"><h3>Sound</h3><button class="btn secondary" data-a="sound">'+(state.sound?"🔊 On":"🔇 Off")+'</button></div><div class="card" style="margin-top:12px"><h3>About</h3><p class="small">DSA Master is a mobile-first DSA learning and interview-practice app. Company names are used only to organize practice tracks and do not imply affiliation.</p></div></div>'}
function unlockTopic(id){var t=TOPICS.find(function(x){return x.id==id});if(!t||unlocked(id))return;if(spend(t.cost)){state.topics[id]=true;save();toast("Topic unlocked");render()}}
function unlockCompany(n,c){if(state.companies[n])return;if(spend(c)){state.companies[n]=true;save();toast("Company track unlocked");render()}}
function complete(id,n){state.lessons[id]=state.lessons[id]||{};if(state.lessons[id]["l"+n])return;state.lessons[id]["l"+n]=true;earn(10);if(progress(id)==100)earn(50);save();toast(progress(id)==100?"+10 + topic bonus 50 coins!":"+10 coins");render()}
function reward(){toast("No coins were added. The webpage cannot verify native ad completion. Configure the rewarded ad in your Android wrapper before using rewards.")}
function answer(o){if(answered)return;selected=o;answered=true;var q=BANK[qi];if(o==q.a){earn(5);state.totalCorrect++;toast("+5 coins — Correct!")}else toast("Not correct — review the answer");state.companyDone=state.companyDone||{};state.companyDone[company]=Math.max(state.companyDone[company]||0,qi+1);save();render()}
function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Copied")}).catch(function(){toast("Copy failed")});else toast("Copy unavailable")}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a=="home"){view="home";render()}else if(a=="learn"){view="learn";render()}else if(a=="companies"){view="companies";render()}else if(a=="profile"){view="profile";render()}
else if(a=="topic"){topicId=b.dataset.id;view="topic";render()}else if(a=="unlock"){unlockTopic(b.dataset.id)}
else if(a=="lesson"){topicId=b.dataset.id;lessonNo=Number(b.dataset.n);view="lesson";render()}
else if(a=="complete"){complete(b.dataset.id,Number(b.dataset.n))}
else if(a=="next"){if(Number(b.dataset.n)<4){topicId=b.dataset.id;lessonNo=Number(b.dataset.n)+1;view="lesson"}else view="topic";render()}
else if(a=="company"){company=b.dataset.name;qi=0;answered=false;selected=null;view="company";render()}
else if(a=="unlock-company"){unlockCompany(b.dataset.name,Number(b.dataset.cost))}
