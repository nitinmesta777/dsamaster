(function(){

:"A substring is?","a":"A contiguous part of a string","w":["Any permutation","A graph path"]},{"cat":"Searching","q":"Binary search requires the search space to be?","a":"Sorted/monotonic","w":["Random","A linked list"]},{"cat":"Searching","q":"Binary search worst-case time is?","a":"O(log n)","w":["O(n)","O(n²)"]},{"cat":"Searching","q":"Linear search worst-case time is?","a":"O(n)","w":["O(1)","O(log n)"]},{"cat":"Sorting","q":"Bubble sort worst-case time is?","a":"O(n²)","w":["O(log n)","O(n log n)"]},{"cat":"Sorting","q":"Merge sort time is typically?","a":"O(n log n)","w":["O(n²)","O(1)"]},{"cat":"Sorting","q":"Quicksort average time is typically?","a":"O(n log n)","w":["O(n)","O(log n)"]},{"cat":"Linked Lists","q":"A node normally stores data plus a?","a":"Reference/link","w":["Hash function","Priority"]},{"cat":"Linked Lists","q":"Insert at the head of a singly linked list is usually?","a":"O(1)","w":["O(n)","O(n²)"]},{"cat":"Linked Lists","q":"Cycle detection commonly uses?","a":"Slow and fast pointers","w":["Binary search","Merge sort"]},{"cat":"Stacks","q":"A stack follows?","a":"LIFO","w":["FIFO","Priority order"]},{"cat":"Stacks","q":"Adding to a stack is called?","a":"Push","w":["Pop","Dequeue"]},{"cat":"Stacks","q":"Removing the top item is called?","a":"Pop","w":["Push","Enqueue"]},{"cat":"Queues","q":"A queue follows?","a":"FIFO","w":["LIFO","Random order"]},{"cat":"Queues","q":"Adding to a queue is called?","a":"Enqueue","w":["Pop","Push"]},{"cat":"Queues","q":"Removing from the front is called?","a":"Dequeue","w":["Push","Peek"]},{"cat":"Hashing","q":"Average hash-table lookup is often?","a":"O(1)","w":["O(log n)","O(n²)"]},{"cat":"Hashing","q":"A collision means?","a":"Two keys map to the same bucket","w":["A tree is balanced","A stack is empty"]},{"cat":"Hashing","q":"A common collision method is?","a":"Chaining","w":["Binary search","DFS"]},{"cat":"Recursion","q":"A recursive function needs a?","a":"Base case","w":["Heap","Queue"]},{"cat":"Recursion","q":"Nested recursive calls are tracked by the?","a":"Call stack","w":["Hash table","Adjacency matrix"]},{"cat":"Recursion","q":"Factorial of 5 equals?","a":"120","w":["25","60"]},{"cat":"Two Pointers","q":"Two pointers means maintaining?","a":"Two indices/references","w":["Two arrays always","Two heaps"]},{"cat":"Two Pointers","q":"On a sorted pair-sum problem, if the sum is too small you often?","a":"Move the left pointer right","w":["Move both left","Restart"]},{"cat":"Two Pointers","q":"Two pointers can often reduce a sorted pair problem from?","a":"O(n²) to O(n)","w":["O(n) to O(n²)","O(log n) to O(n²)"]},{"cat":"Sliding Window","q":"A sliding window represents?","a":"A moving contiguous range","w":["A tree branch","A graph edge"]},{"cat":"Sliding Window","q":"Sliding window is especially useful for?","a":"Subarray/substring ranges","w":["Tree rotations","Heap construction"]},{"cat":"Sliding Window","q":"When a window violates a constraint, a common action is to?","a":"Move the left boundary","w":["Sort the whole input","Run DFS"]},{"cat":"Trees","q":"A node with no children is a?","a":"Leaf","w":["Root","Edge"]},{"cat":"Trees","q":"Traversal that visits root before children is?","a":"Preorder","w":["Inorder","Postorder"]},{"cat":"Trees","q":"Traversal left-root-right is?","a":"Inorder","w":["Preorder","BFS"]},{"cat":"Binary Search Tree","q":"In a typical BST, values in the left subtree are?","a":"Smaller than the node","w":["Always larger","Always equal"]},{"cat":"Binary Search Tree","q":"Balanced BST search is typically?","a":"O(log n)","w":["O(n²)","O(1)"]},{"cat":"Binary Search Tree","q":"A completely skewed BST can have search time?","a":"O(n)","w":["O(log n) always","O(1)"]},{"cat":"Heaps & Priority Queue","q":"The root of a min-heap is the?","a":"Minimum element","w":["Maximum element","Median"]},{"cat":"Heaps & Priority Queue","q":"Heap insertion is usually?","a":"O(log n)","w":["O(n²)","O(1) always"]},{"cat":"Heaps & Priority Queue","q":"A priority queue is commonly implemented with a?","a":"Heap","w":["String","Graph"]},{"cat":"Graphs","q":"A graph vertex is a?","a":"Node","w":["Sorting pass","Hash bucket"]},{"cat":"Graphs","q":"A graph edge represents a?","a":"Connection","w":["Stack frame","Tree height"]},{"cat":"Graphs","q":"A sparse graph is commonly stored using an?","a":"Adjacency list","w":["Only an array of values","Only a stack"]},{"cat":"Greedy Algorithms","q":"A greedy algorithm chooses?","a":"A locally best option","w":["Every possibility","A random option"]},{"cat":"Greedy Algorithms","q":"Greedy correctness requires?","a":"A problem-specific proof/greedy property","w":["No proof ever","Sorting twice"]},{"cat":"Greedy Algorithms","q":"Which is a classic greedy-style problem?","a":"Activity selection","w":["Binary search","String reversal"]},{"cat":"Dynamic Programming","q":"DP commonly uses?","a":"Overlapping subproblems and optimal substructure","w":["Only hashing","Only sorting"]},{"cat":"Dynamic Programming","q":"Memoization stores?","a":"Previously computed results","w":["Only input indexes","Graph edges"]},{"cat":"Dynamic Programming","q":"Bottom-up DP usually starts from?","a":"Base cases","w":["The final answer only","Random states"]},{"cat":"Backtracking","q":"Backtracking generally means?","a":"Choose, recurse, undo","w":["Sort, hash, stop","BFS only"]},{"cat":"Backtracking","q":"N-Queens is commonly solved using?","a":"Backtracking","w":["Binary search","Bubble sort"]},{"cat":"Backtracking","q":"A backtracking solution should stop exploring a branch when?","a":"The partial choice cannot lead to a valid solution","w":["The array is sorted","The queue is empty"]},{"cat":"Advanced DSA","q":"Before choosing an algorithm, inspect the?","a":"Constraints","w":["Variable names only","Screen size"]},{"cat":"Advanced DSA","q":"If n is extremely large, an O(n²) solution is usually?","a":"Risky/too slow","w":["Always ideal","Required"]},{"cat":"Advanced DSA","q":"A strong interview explanation should include?","a":"Approach, correctness and complexity","w":["Only final code","Only output"]}], LESSONS=["Concept & Why It Matters", "Core Operations & Patterns", "Code & Line-by-Line Thinking", "Practice, Complexity & Interview Tips"];
var KEY="dsa_master_final_v6", state=load(), view="home", topicId=null, lessonNo=1, company=null, qi=0, answered=false, selected=null;

function conceptText(topicName,lessonIndex){
  const common={
    "Big-O & Complexity":
      "Big-O describes how an algorithm's running time or memory usage grows as input size increases.",
    "Arrays":
      "An array stores elements in an ordered sequence and gives fast access using an index.",
    "Strings":
      "A string is a sequence of characters. Many interview problems involve searching, counting and transforming characters.",
    "Searching":
      "Searching means finding whether a target value exists and locating its position efficiently.",
    "Sorting":
      "Sorting arranges values into a chosen order and is a foundation for many algorithms.",
    "Linked Lists":
      "A linked list stores data in nodes connected using references or pointers.",
    "Stacks":
      "A stack follows LIFO: the last item inserted is the first item removed.",
    "Queues":
      "A queue follows FIFO: the first item inserted is the first item removed.",
    "Hashing":
      "Hashing maps keys to locations so that lookup can usually be performed very quickly.",
    "Recursion":
      "Recursion solves a problem by reducing it into smaller versions of the same problem.",
    "Two Pointers":
      "Two-pointer techniques maintain two positions while scanning a sequence.",
    "Sliding Window":
      "Sliding-window techniques maintain a changing range of elements instead of repeatedly processing the whole range.",
    "Trees":
      "A tree is a hierarchical structure made from nodes and edges.",
    "Binary Search Tree":
      "A BST maintains an ordering where smaller values are on the left and larger values are on the right.",
    "Heaps & Priority Queue":
      "A heap is a tree-based structure commonly used to efficiently retrieve the minimum or maximum element.",
    "Graphs":
      "A graph represents relationships between objects using vertices and edges.",
    "Greedy Algorithms":
      "Greedy algorithms repeatedly choose the locally best option with the goal of reaching a globally good solution.",
    "Dynamic Programming":
      "Dynamic programming solves overlapping subproblems while storing results so the same work is not repeated.",
    "Backtracking":
      "Backtracking explores possible choices and reverses a choice when it cannot lead to a valid solution.",
    "Advanced DSA":
      "Advanced DSA combines multiple data structures and algorithmic patterns to solve harder problems efficiently."
  };

  const base=common[topicName]||"This lesson introduces an important data-structures and algorithms concept.";

  const extras=[
    "First understand the idea before memorizing code. Focus on what changes at every step.",
    "The most important skill is recognizing when this technique is useful.",
    "Trace a small example manually before writing the program.",
    "Interview questions usually test both correctness and complexity."
  ];

  return base+" "+extras[lessonIndex]||base;
}

function lineExplanation(code,lang){

    }else if(clean.startsWith("#")||clean.startsWith("//")||clean.startsWith("/*")){
      explanation="This is a comment explaining the code.";
    }else if(clean.includes("for")){
      explanation="This line starts a loop and repeats an operation.";
    }else if(clean.includes("if")){
      explanation="This line checks a condition.";
    }else if(clean.includes("return")){
      explanation="This line returns a result from the function.";

      explanation="This line displays output.";
    }else if(clean.includes("def ")||clean.includes("function ")||clean.includes("void ")||clean.-style question collection."
  }
];

  },600);
}

function watchAd(amount){
  showToast("Loading rewarded ad...");
  setTimeout(function(){
    state.coins += amount;
    saveState();
    sound();
    showToast("Reward received: +"+amount+" coins");
    render();
  },1000);
}

function completeLesson(){
  const key = currentTopic+"_"+currentLesson;

  if(state.completed[key]){
    showToast("Lesson already completed");
    return;
  }

  state.completed[key] = true;
  state.coins += 10;

  if(topicCompleted(currentTopic)){
    state.coins += 50;
    showToast("Lesson complete! Topic bonus +50 coins");
  }else{
    showToast("Lesson complete! +10 coins");
  }

  saveState();
  sound();
  render();
}

function updateStreak(){
  const today = new Date().toDateString();

  if(state.lastDay !== today){
    state.streak += 1;
    state.lastDay = today;
    saveState();
  }
}

function lessonContent(topic,lessonIndex){
  const lessonName = baseLessons[topic.name][lessonIndex];

  const generic = {
    concept:
      "The most important goal of this lesson is not memorizing code. " +
      "You should understand what the data structure or algorithm is doing, " +
      "why it is useful, and when you should choose it. " +
      "Imagine that you are solving a problem with pen and paper first. " +
      "The code is simply a way of expressing the solution to the computer.",
    why:
      "DSA is important because a correct program is not always an efficient program. " +
      "When the input becomes large, a slow approach can become extremely difficult to use. " +
      "Good data structures help us store information properly, while good algorithms help us process that information efficiently.",
    analogy:
      "Think about a library. If every book is placed randomly on the floor, finding one book takes a long time. " +
      "If books are organized into sections and shelves, searching becomes much easier. " +
      "Data structures are like the organization system, while algorithms are like the procedure used to find or process something.",
    working:
      "First understand the input. Then identify what information must be stored. " +
      "Next choose the operation that happens most frequently. Finally choose a data structure or algorithm that makes that operation efficient. " +
      "Always think about edge cases such as empty input, one element, duplicate values and very large input.",
    mistakes:
      "Common mistakes include memorizing code without understanding it, ignoring edge cases, using nested loops unnecessarily, " +
      "and forgetting to analyze time and space complexity. Another common mistake is choosing a data structure simply because it is familiar instead of choosing it because it fits the problem.",
    interview:
      "In an interview, explain your thought process before writing code. State the simple approach first, then improve it. " +
      "Mention the time complexity and space complexity of your final solution. This shows the interviewer that you understand both coding and problem solving.",
    takeaway:
      "The key takeaway is simple: understand the problem first, choose the right structure or algorithm second, and write the code third."
  };

  let specific = "";

  if(topic.name==="Arrays"){
    specific =
      "An array stores multiple values in an ordered sequence. " +
      "Each value is normally accessed using an index. In many languages the first index is 0. " +
      "This makes direct access extremely fast because the computer can calculate where an element is located.";
  }
  else if(topic.name==="Strings"){
    specific =
      "A string represents text as a sequence of characters. " +
      "Many interview questions are actually array-style problems applied to characters. " +
      "You should become comfortable with indexing, counting, comparison, reversal and searching.";
  }
  else if(topic.name==="Searching"){
    specific =
      "Searching means finding a required value in a collection. " +
      "Linear search checks elements one by one. Binary search is much faster but requires the data to be sorted and repeatedly cuts the search range in half.";
  }
  else if(topic.name==="Sorting"){
    specific =
      "Sorting means arranging values into an order such as ascending or descending. " +
      "Different algorithms have different performance characteristics. Learning simple algorithms first gives you a strong foundation for understanding more advanced sorting techniques.";
  }
  else if(topic.name==="Linked Lists"){
    specific =
      "A linked list is made from nodes. A node stores data and a reference to another node. " +
      "Unlike an array, linked-list nodes do not need to be next to each other in memory. " +
      "This makes insertion and deletion flexible when the correct node position is already known.";
  }
  else if(topic.name==="Stacks"){
    specific =
      "A stack follows Last-In-First-Out. The last item inserted is the first item removed. " +
      "A real-world example is a stack of plates. You normally take the top plate first.";
  }
  else if(topic.name==="Queues"){
    specific =
      "A queue follows First-In-First-Out. The first item entering the queue is the first item leaving it. " +
      "People waiting in a line are a simple real-world example.";
  }
  else if(topic.name==="Hashing"){
    specific =
      "Hashing attempts to convert a key into a location where its associated value can be stored or found. " +
      "With a good hash table implementation, lookup can be extremely fast on average.";
  }
  else if(topic.name==="Recursion"){
    specific =
      "Recursion happens when a function solves a problem by calling itself on a smaller version of the same problem. " +
      "Every recursive solution needs a base case so that the calls eventually stop.";
  }
  else if(topic.name==="Two Pointers"){
    specific =
      "The two-pointer technique uses two indexes instead of repeatedly scanning the same data. " +
      "The pointers can move toward each other or in the same direction depending on the problem.";
  }
  else if(topic.name==="Sliding Window"){
    specific =
      "Sliding window is useful when a problem asks about a continuous part of an array or string. " +
      "Instead of calculating every range from scratch, we update a running window as it moves.";
  }
  else if(topic.name==="Trees"){
    specific =
      "A tree is a hierarchical structure made from nodes connected by edges. " +
      "A tree has a root and can contain child nodes. Traversal means visiting nodes in a particular order.";
  }
  else if(topic.name==="Binary Search Tree"){
    specific =
      "A binary search tree follows an ordering rule: values smaller than a node are normally placed on one side and larger values on the other. " +
      "This structure can make searching efficient when the tree remains reasonably balanced.";
  }
  else if(topic.name==="Heaps & Priority Queue"){
    specific =
      "A heap is a tree-based structure commonly represented using an array. " +
      "It allows us to quickly access the highest-priority or lowest-priority element depending on the heap type.";
  }
  else if(topic.name==="Graphs"){
    specific =
      "A graph represents relationships between objects. Objects are vertices and relationships are edges. " +
      "Graphs are used in maps, social networks, computer networks and many real-world systems.";
  }
  else if(topic.name==="Greedy Algorithms"){
    specific =
      "A greedy algorithm repeatedly chooses what appears to be the best choice at the current moment. " +
      "Greedy methods can be very efficient, but they only work when the problem has the right mathematical structure.";
  }
  else if(topic.name==="Dynamic Programming"){
    specific =
      "Dynamic programming solves problems with overlapping subproblems by remembering results that have already been calculated. " +
      "This can turn a huge number of repeated calculations into a manageable number of calculations.";
  }
  else if(topic.name==="Backtracking"){
    specific =
      "Backtracking explores possible choices. When a choice leads to an invalid or unsuccessful path, the algorithm reverses that choice and tries another path.";
  }
  else if(topic.name==="Advanced DSA"){
    specific =
      "Advanced DSA is about combining the concepts you have already learned. " +
      "Interview problems often do not tell you which data structure to use. Your job is to recognize the pattern and construct an efficient solution.";
  }
  else if(topic.name==="Big-O & Complexity"){
    specific =
      "Big-O describes how the resource requirements of an algorithm grow as the input size grows. " +
      "For example, scanning n values once is usually O(n), while comparing every pair can become O(n²).";
  }

  return Object.assign({},generic,{
    lessonName:lessonName,
    specific:specific
  });
}

function lineExplanation(code,lang){
  const lines = code.split("\n");
  return lines.map(function(line,index){
    const clean = line.trim();

    if(!clean){
      return "<p><b>Line "+(index+1)+":</b> This blank line improves readability.</p>";
    }

    return "<p><b>Line "+(index+1)+":</b> "+escapeHTML(explainCodeLine(clean,lang)+"</p>");
  }).join("");
}

function explainCodeLine(line,lang){

  if(line.startsWith("#include")){
    return "This imports a library needed by the program.";
  }

  if(line.includes("main")){
    return "This is the main entry point of the program.";
  }

  if(line.includes("for")){
    return "This loop repeats an operation for multiple values.";
  }

  if(line.includes("while")){
    return "This loop continues while its condition remains true.";
  }

  if(line.includes("if")){
    return "This condition checks whether a specific situation is true.";
  }

  if(line.includes("return")){
    return "This returns a value or exits the current function.";
  }

  if(line.includes("print") || line.includes("cout") || line.includes("System.out") || line.includes("console.log")){
    return "This displays information so we can see the result.";
  }

  if(line.includes("def ") || line.includes("function") || line.includes("void ")){
    return "This defines a function that contains reusable instructions.";
  }

  if(line.includes("push") || line.includes("append")){
    return "This adds a value to a data structure.";
  }

  if(line.includes("pop") || line.includes("popleft")){
    return "This removes a value from the data structure.";
  }

  if(line.includes("=")){
    return "This assigns a value to a variable or updates existing data.";
  }

  return "This line is part of the implementation and helps the algorithm perform its required operation.";
}

function escapeHTML(text){
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

function answerCompany(answer,correct){

  const buttons=document.querySelectorAll("[data-action='companyAnswer']");

  buttons.forEach(function(btn){
    btn.disabled=true;

    const value=Number(btn.dataset.answer);

    if(value===Number(correct))
      btn.classList.add("correct");

    if(value===Number(answer) && value!==Number(correct))
      btn.classList.add("wrong");
  });

  if(Number(answer)===Number(correct)){
    state.coins+=15;
    saveState();
    sound();
    showToast("Correct! +15 coins");
  }else{
    showToast("Wrong answer. Study the concept and try again.");
  }
}

document.addEventListener("click",function(event){

  const btn=event.target.closest("[data-action]");

  if(!btn) return;

  const action=btn.dataset.action;

  if(action==="nav"){
    currentPage=btn.dataset.page;
    render();
    sound();
    return;
  }

  if(action==="topic"){
    openTopic(btn.dataset.topic);
    sound();
    return;
  }

  if(action==="unlockTopic"){
    const topic=topics.find(function(t){
      return t.id===btn.dataset.topic;
    });

    if(topic) unlockTopic(topic);
    return;
  }

  if(action==="lesson"){
    openLesson(btn.dataset.topic,btn.dataset.lesson);
    sound();
    return;
  }

  if(action==="completeLesson"){
    completeLesson();
    return;
  }

  if(action==="nextLesson"){
    nextLesson();
    return;
  }

  if(action==="language"){
    state.selectedLanguage=btn.dataset.language;
    saveState();
    sound();
    render();
    return;
  }

  if(action==="ad"){
    watchAd(Number(btn.dataset.amount));
    return;
  }

  if(action==="startPractice"){
    startPractice(btn.dataset.topic);
    sound();
    return;
  }

  if(action==="practiceAnswer"){
    answerPractice(
      Number(btn.dataset.answer),
      Number(btn.dataset.correct)
    );
    return;
  }

  if(action==="testAnswer"){
    answerTest(
      Number(btn.dataset.answer),
      Number(btn.dataset.correct)
    );
    return;
  }

  if(action==="restartTest"){
    restartTest();
    return;
  }

  if(action==="unlockCompany"){

    const company=companies.find(function(c){
      return c.id===btn.dataset.company;
    });

    if(company) unlockCompany(company);

    return;
  }

  if(action==="company"){
    openCompany(btn.dataset.company);
    sound();
    return;
  }

  if(action==="companyAnswer"){
    answerCompany(
      Number(btn.dataset.answer),
      Number(btn.dataset.correct)
    );
    return;
  }

  if(action==="copyReferral"){

    const input=document.getElementById("refCode");

    if(input){
      input.select();

      try{
        navigator.clipboard.writeText(state.referralCode);
        showToast("Referral code copied");
      }catch(e){
        showToast("Code selected. Copy it manually.");
      }
    }

    return;
  }

  if(action==="shareReferral"){

    const text=
      "Join me on DSA Master and learn DSA! My referral code is "+
      state.referralCode;

    if(navigator.share){

      navigator.share({
        title:"DSA Master",
        text:text
      }).catch(function(){});

    }else{

      try{
        navigator.clipboard.writeText(text);
        showToast("Referral message copied");
      }catch(e){
        showToast(text);
      }

    }

    return;
  }

  if(action==="saveNickname"){

    const input=document.getElementById("nicknameInput");

    if(input){

      const name=input.value.trim();

      if(name){
        state.nickname=name.substring(0,20);
        saveState();
        showToast("Name saved");
        render();
      }

    }

    return;
  }

  if(action==="toggleSound"){

    state.sound=!state.sound;
    saveState();
    render();

    return;
  }

  if(action==="reset"){

    const yes=confirm(
      "Reset all DSA Master progress, coins and unlocks?"
    );

    if(yes){

      state=createDefaultState();
      saveState();

      currentPage="home";
      currentTopic=null;
      currentCompany=null;

      showToast("Everything has been reset");
      render();
    }

    return;
  }

});

window.addEventListener("error",function(event){

  console.error("DSA Master error:",event.error || event.message);

  const app=document.getElementById("app");

  if(app && currentPage){
    const existing=document.getElementById("appError");

    if(!existing){

      const errorBox=document.createElement("div");

      errorBox.id="appError";
      errorBox.className="warning";
      errorBox.style.margin="15px";
      errorBox.innerHTML=
        "<b>Something went wrong.</b><br>"+
        "Please refresh the CodePen preview.";

      app.prepend(errorBox);
    }
  }

});

setTimeout(function(){

  currentPage="home";
  render();

},700);

})();
</script>
